<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dupont Admin</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ══════ ÉCRAN DE CONNEXION ══════ -->
<div id="login-overlay" class="modal-overlay active">
  <div class="modal" style="width:360px;">
    <h3>Connexion</h3>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="ton@email.com" autocomplete="username">
    <label>Mot de passe</label>
    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    <div id="login-error" style="color:#ff5577;font-size:.8rem;display:none;margin-top:6px;"></div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button id="login-btn" class="btn btn-primary">Se connecter</button>
    </div>
  </div>
</div>

<!-- ══════ APPLICATION ══════ -->
<div id="app-root" style="display:none;">
<div class="shell">

  <aside class="sidebar">
    <div class="brand-block">
      <div class="brand-mark">DP</div>
      <div class="brand-text">Dupont<span>Admin</span></div>
    </div>
    <nav class="nav">
      <button class="tab-btn active" data-tab="demandes"><span class="nav-ic">✉</span>Messages</button>
      <button class="tab-btn" data-tab="artistes"><span class="nav-ic">◈</span>Artistes</button>
      <button class="tab-btn" data-tab="discographie"><span class="nav-ic">◐</span>Discographie</button>
      <button class="tab-btn" data-tab="stats"><span class="nav-ic">▲</span>Statistiques</button>
    </nav>
    <button id="btn-logout" class="logout-btn">Déconnexion</button>
  </aside>

  <main class="content">

  <!-- ══════ ONGLET DEMANDES ══════ -->
  <section id="tab-demandes" class="tab-panel active">
    <div class="panel-head">
      <h2>Messages</h2>
      <button id="btn-add-demande" class="btn btn-primary">+ Ajouter une demande</button>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="tous">Toutes</button>
      <button class="filter-btn" data-filter="nouveau">Nouveau</button>
      <button class="filter-btn" data-filter="en_cours">En cours</button>
      <button class="filter-btn" data-filter="traite">Traité</button>
      <button class="filter-btn" data-filter="refuse">Refusé</button>
    </div>
    <div id="demandes-list" class="list"></div>
  </section>

  <!-- ══════ ONGLET ARTISTES ══════ -->
  <section id="tab-artistes" class="tab-panel">
    <div class="panel-head">
      <h2>Artistes du label</h2>
    <div class="head-actions">
      <button id="btn-refresh" class="btn btn-ghost">🔄 Actualiser</button>
      <button id="btn-add-artiste" class="btn btn-primary">+ Ajouter un artiste</button>
    </div>
  </div>
  <div id="artistes-list" class="list"></div>
</section>

<!-- ══════ ONGLET DISCOGRAPHIE ══════ -->
<section id="tab-discographie" class="tab-panel">
  <div class="panel-head">
    <h2>Discographie</h2>
    <button id="btn-add-track" class="btn btn-primary">+ Ajouter un titre</button>
  </div>
  <div style="margin-bottom:16px;">
    <label style="font-size:.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;">Filtrer par artiste</label>
    <select id="disco-filter-artiste" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-family:inherit;font-size:.88rem;margin-top:4px;width:260px;">
      <option value="">Tous les artistes</option>
    </select>
  </div>
  <div id="discographie-tab-list" class="list"></div>
</section>

<!-- ══════ ONGLET STATISTIQUES ══════ -->
<section id="tab-stats" class="tab-panel">
  <div class="panel-head">
    <h2>Statistiques par artiste</h2>
  </div>
  <div id="stats-list" class="list"></div>
</section>

<!-- ══════ MODALE DEMANDE ══════ -->
<div id="modal-demande" class="modal-overlay">
  <div class="modal">
    <h3 id="modal-demande-title">Nouvelle demande</h3>
    <input type="hidden" id="d-id">
    <label>Type</label>
    <select id="d-type">
      <option value="contact">Message de contact</option>
      <option value="reservation">Réservation studio</option>
    </select>
    <label>Nom</label>
    <input type="text" id="d-nom" placeholder="Nom de la personne">
    <label>Email</label>
    <input type="text" id="d-email" placeholder="email@exemple.com">

    <div id="d-champs-contact">
      <label>Profil</label>
      <input type="text" id="d-profil" placeholder="Artiste / Fan / Investisseur...">
      <label>Lien musique (si démo)</label>
      <input type="text" id="d-lien" placeholder="SoundCloud, YouTube, Drive...">
    </div>

    <div id="d-champs-reservation" style="display:none;">
      <label>Téléphone</label>
      <input type="text" id="d-telephone" placeholder="06 12 34 56 78">
      <div class="row">
        <div>
          <label>Date souhaitée</label>
          <input type="date" id="d-date">
        </div>
        <div>
          <label>Heure début</label>
          <input type="time" id="d-heure-debut">
        </div>
      </div>
      <label>Heure fin</label>
      <input type="time" id="d-heure-fin">
    </div>

    <label>Message</label>
    <textarea id="d-message" rows="4" placeholder="Message"></textarea>
    <label>Statut</label>
    <select id="d-statut">
      <option value="nouveau">Nouveau</option>
      <option value="en_cours">En cours</option>
      <option value="traite">Traité</option>
      <option value="refuse">Refusé</option>
    </select>
    <label>Note interne (privée)</label>
    <textarea id="d-note" rows="2" placeholder="Tes notes personnelles..."></textarea>
    <div class="modal-actions">
      <button id="d-delete" class="btn btn-danger" style="display:none;">Supprimer</button>
      <div class="spacer"></div>
      <button id="d-cancel" class="btn btn-ghost">Annuler</button>
      <button id="d-save" class="btn btn-primary">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ══════ MODALE ARTISTE ══════ -->
<div id="modal-artiste" class="modal-overlay">
  <div class="modal">
    <h3 id="modal-artiste-title">Nouvel artiste</h3>
    <input type="hidden" id="a-id">
    <label>Nom d'artiste</label>
    <input type="text" id="a-nom" placeholder="Ex: WW">
    <label>Style / accroche</label>
    <input type="text" id="a-style" placeholder="Ex: Artiste Mélodique · Urbain">
    <label>Bio</label>
    <textarea id="a-bio" rows="3" placeholder="Description de l'artiste"></textarea>
    <label>Photo</label>
    <div class="row" style="grid-template-columns:1fr auto;align-items:end;">
      <input type="text" id="a-photo" placeholder="https://... (ou choisis un fichier)">
      <button type="button" id="a-photo-upload-btn" class="btn btn-ghost">📁 Choisir</button>
    </div>
    <input type="file" id="a-photo-file" accept="image/*" style="display:none;">
    <div class="row">
      <div>
        <label>Spotify</label>
        <input type="text" id="a-spotify" placeholder="https://open.spotify.com/...">
      </div>
      <div>
        <label>YouTube</label>
        <input type="text" id="a-youtube" placeholder="https://youtube.com/...">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Apple Music</label>
        <input type="text" id="a-apple" placeholder="https://music.apple.com/...">
      </div>
      <div>
        <label>Deezer</label>
        <input type="text" id="a-deezer" placeholder="https://deezer.com/...">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Pays d'écoute</label>
        <input type="number" id="a-pays" placeholder="14">
      </div>
      <div>
        <label>Ordre d'affichage</label>
        <input type="number" id="a-ordre" placeholder="1">
      </div>
    </div>
    <label>Statut</label>
    <select id="a-statut">
      <option value="actif">Actif</option>
      <option value="a_venir">À venir</option>
      <option value="archive">Archivé</option>
    </select>
    <label style="margin-top:10px;display:block;font-weight:700;">Barres de style (affichées sur le site)</label>
    <div class="row">
      <div>
        <label>Barre 1 — Nom</label>
        <input type="text" id="a-bar1-label" placeholder="Ex: Mélodie">
      </div>
      <div>
        <label>Barre 1 — Valeur (%)</label>
        <input type="number" id="a-bar1-value" min="0" max="100" placeholder="88">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Barre 2 — Nom</label>
        <input type="text" id="a-bar2-label" placeholder="Ex: Énergie">
      </div>
      <div>
        <label>Barre 2 — Valeur (%)</label>
        <input type="number" id="a-bar2-value" min="0" max="100" placeholder="75">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Barre 3 — Nom</label>
        <input type="text" id="a-bar3-label" placeholder="Ex: Originalité">
      </div>
      <div>
        <label>Barre 3 — Valeur (%)</label>
        <input type="number" id="a-bar3-value" min="0" max="100" placeholder="92">
      </div>
    </div>
    <div class="modal-actions">
      <button id="a-delete" class="btn btn-danger" style="display:none;">Supprimer</button>
      <div class="spacer"></div>
      <button id="a-cancel" class="btn btn-ghost">Annuler</button>
      <button id="a-save" class="btn btn-primary">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ══════ MODALE STATISTIQUES ══════ -->
<div id="modal-stats" class="modal-overlay">
  <div class="modal">
    <h3 id="modal-stats-title">Statistiques</h3>
    <input type="hidden" id="s-id">
    <div class="row">
      <div>
        <label>Streams (Spotify...)</label>
        <input type="number" id="s-streams" placeholder="120000">
      </div>
      <div>
        <label>Abonnés</label>
        <input type="number" id="s-abonnes" placeholder="5400">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Écoutes / mois</label>
        <input type="number" id="s-ecoutes" placeholder="32000">
      </div>
      <div>
        <label>Vues YouTube (total)</label>
        <input type="number" id="s-vues-youtube" placeholder="180000">
      </div>
    </div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button id="s-cancel" class="btn btn-ghost">Annuler</button>
      <button id="s-save" class="btn btn-primary">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ══════ MODALE TITRE (ajout/édition discographie) ══════ -->
<div id="modal-track" class="modal-overlay">
  <div class="modal">
    <h3 id="modal-track-title">Nouveau titre</h3>
    <input type="hidden" id="t-id">
    <label>Artiste</label>
    <select id="t-artiste"></select>
    <label>Titre</label>
    <input type="text" id="t-titre" placeholder="Nom du morceau">
    <div class="row">
      <div>
        <label>Type</label>
        <select id="t-type">
          <option value="single">Single</option>
          <option value="ep">EP</option>
          <option value="album">Album</option>
        </select>
      </div>
      <div>
        <label>Date de sortie</label>
        <input type="date" id="t-date">
      </div>
    </div>
    <label>Pochette</label>
    <div class="row" style="grid-template-columns:1fr auto;align-items:end;">
      <input type="text" id="t-cover" placeholder="https://... (ou choisis un fichier)">
      <button type="button" id="t-cover-upload-btn" class="btn btn-ghost">📁 Choisir</button>
    </div>
    <input type="file" id="t-cover-file" accept="image/*" style="display:none;">
    <div class="row">
      <div>
        <label>Spotify</label>
        <input type="text" id="t-spotify" placeholder="https://open.spotify.com/...">
      </div>
      <div>
        <label>YouTube</label>
        <input type="text" id="t-youtube" placeholder="https://youtube.com/...">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Apple Music</label>
        <input type="text" id="t-apple" placeholder="https://music.apple.com/...">
      </div>
      <div>
        <label>Deezer</label>
        <input type="text" id="t-deezer" placeholder="https://deezer.com/...">
      </div>
    </div>
    <div class="modal-actions">
      <button id="t-delete" class="btn btn-danger" style="display:none;">Supprimer</button>
      <div class="spacer"></div>
      <button id="t-cancel" class="btn btn-ghost">Annuler</button>
      <button id="t-save" class="btn btn-primary">Enregistrer</button>
    </div>
  </div>
</div>

  </main>
</div>
</div><!-- /app-root -->

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
